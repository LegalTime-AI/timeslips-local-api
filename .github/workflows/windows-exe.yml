name: windows-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[pack]"
      - run: pyinstaller --noconfirm --clean pack/timeslips-helper.spec
      - uses: actions/upload-artifact@v4
        with:
          name: TimeslipsHelper
          path: dist/TimeslipsHelper.exe
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/TimeslipsHelper.exe --clobber
          else
            gh release create "${{ github.ref_name }}" dist/TimeslipsHelper.exe --generate-notes --verify-tag
          fi
