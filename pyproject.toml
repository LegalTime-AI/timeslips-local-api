[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeslips-local-api"
version = "0.1.0"
description = "Unofficial loopback HTTP API for Sage Timeslips Premium (Firebird)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LegalTime AI" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "firebirdsql>=1.4",
  "passlib>=1.7",
  "pydantic-settings>=2.6",
]

[project.urls]
Homepage = "https://github.com/LegalTime-AI/timeslips-local-api"
Issues = "https://github.com/LegalTime-AI/timeslips-local-api/issues"

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
timeslips-local-api = "timeslips_local_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
